controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    diff_controller:
      type: diff_drive_controller/DiffDriveController

diff_controller:
  ros__parameters:

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    
    use_stamped_vel: false

    wheel_separation: 0.273
    wheel_radius: 0.075

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 10.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    position_feedback: false # Аппаратный драйвер экспортирует скорость колёс (velocity), а не положение (position),
    enable_odom_tf: false
    #Этот параметр управляет публикацией трансформации между системами координат odom_frame_id (одометрия) и base_frame_id (база робота). Если установлен в true, #контроллер будет публиковать преобразование, что позволяет другим компонентам системы (например, визуализаторам или другим узлам) корректно отслеживать положение #робота в пространстве. По умолчанию значение — true, что позволяет поддерживать правильную систему координат в системе ROS2


    cmd_vel_timeout: 0.5
    publish_limited_velocity: false
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 2.54 # m/s
    linear.x.min_velocity: -2.54